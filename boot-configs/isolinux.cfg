UI menu.c32
TIMEOUT 30
PROMPT 0

MENU TITLE Automatic Linux Installer
MENU COLOR border 30;44 #40ffffff #a0000000 std

LABEL autoinstall
    MENU LABEL ^Auto-Install to Hard Drive
    MENU DEFAULT
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live live-media-path=/live/ hostname=minimal-linux username=installer nomodeset vga=normal autoinstall=true